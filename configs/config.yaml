project:
  name: "bandung-house-price-prediction"
  version: "0.0.1"
  random_state: 42

data:
  raw_file: "bandung_house_price.csv"
  interim_file: "cleaned.csv"
  processed_file: "features.csv"
  target_column: "price"
  raw_has_header: false

raw_columns:
  - property_type
  - is_premier
  - price_raw
  - installment_raw
  - title
  - location_raw
  - bedroom_count
  - bathroom_count
  - carport_count
  - land_area_raw
  - building_area_raw

features:
  # Kolom yang WAJIB > 0 (tidak mungkin nol)
  strict_positive:
    - price
    - land_area
    - building_area
  # Kolom yang boleh bernilai 0
  allow_zero:
    - bedroom_count
    - bathroom_count
    - carport_count
  # Fitur untuk model
  numeric:
    - bedroom_count
    - bathroom_count
    - carport_count
    - land_area
    - building_area
  categorical:
    - location
  drop:
    - property_type
    - is_premier
    - installment_raw
    - title
    - price_raw
    - location_raw
    - land_area_raw
    - building_area_raw

preprocessing:
  outlier_method: "iqr"
  outlier_threshold: 3.0
  missing_strategy: "median"
  test_size: 0.2
  val_size: 0.1
  price_lower_quantile: 0.01
  price_upper_quantile: 0.99
  log_transform_target: true

model:
  candidates:
    - name: "ridge"
      params:
        alpha: [0.1, 1.0, 10.0]
    - name: "random_forest"
      params:
        n_estimators: [100, 200, 300]
        max_depth: [5, 10, null]
    - name: "gradient_boosting"
      params:
        n_estimators: [100, 200]
        learning_rate: [0.05, 0.1]
        max_depth: [3, 5, 7]
  cv_folds: 5
  scoring: "neg_mean_absolute_percentage_error"

artifacts:
  model_filename: "best_model.joblib"
  preprocessor_filename: "preprocessor.joblib"
  metrics_filename: "metrics.json"